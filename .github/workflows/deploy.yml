name: Auto Deploy LifeOS to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deploy Script on VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 195.88.211.147
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: 22
          script: |
            echo "🚀 Connecting to VPS for Auto Deployment..."
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            cd /opt/lifeos 2>/dev/null || cd /var/www/lifeos
            bash deploy.sh
