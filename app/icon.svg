<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Glowing Container Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#181825" />
      <stop offset="100%" stop-color="#09090e" />
    </radialGradient>

    <!-- Vibrant Gradient Accent -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primaryGrad)" stroke-width="6" stroke-opacity="0.3" />

  <!-- Outer Habit Orbit Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#primaryGrad)" stroke-width="18" stroke-linecap="round" stroke-dasharray="720 180" opacity="0.85" filter="url(#glow)" />
  
  <!-- Orbit Accent Nodes -->
  <circle cx="416" cy="256" r="12" fill="#10b981" />
  <circle cx="256" cy="96" r="8" fill="#6366f1" />
  <circle cx="96" cy="256" r="10" fill="#8b5cf6" />

  <!-- Center Core Goal Sparkle Star (Life OS Emblem) -->
  <g filter="url(#glow)">
    <!-- Central 4-Point Spark Star -->
    <path d="M 256 144 Q 256 256 368 256 Q 256 256 256 368 Q 256 256 144 256 Q 256 256 256 144 Z" fill="url(#starGrad)" />
    <!-- Secondary Small Sparkle Accent -->
    <path d="M 256 196 Q 256 256 316 256 Q 256 256 256 316 Q 256 256 196 256 Q 256 256 256 196 Z" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
